name: fiap-video

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-api:
    build:
      context: .
      dockerfile: src/Auth/Dockerfile
    environment:
      ConnectionStrings__Auth: "Host=postgres;Port=5432;Database=${AUTH_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Database__MigrateOnStartup: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:8080"

volumes:
  auth-db-data:
